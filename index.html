<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — AI Interview Room</title>
  <link rel="stylesheet" href="/student.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .login-form {
      padding: 2.5rem;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
    }
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .avatar-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 1.75rem;
    }
    .grid-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.375rem;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      border-color: var(--accent-primary);
    }
    select.input-field {
      background: rgba(0, 0, 0, 0.4);
      color: white;
      cursor: pointer;
    }
    .error-box {
      padding: 0.75rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 0.5rem;
      margin-bottom: 1.25rem;
      color: var(--accent-danger);
      font-size: 0.875rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <form id="loginForm" class="glass-panel login-form animate-fade-in-up">
      <!-- Header -->
      <div class="header">
        <div class="avatar-icon">🎓</div>
        <h2>Student Registration</h2>
        <p style="margin-top: 0.25rem;">Enter your details to begin the AI mock interview</p>
      </div>

      <!-- Input Fields -->
      <div class="form-grid">
        <div class="grid-row-2">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="studentName" required placeholder="John Doe" class="input-field">
          </div>
          <div class="form-group">
            <label>USN *</label>
            <input type="text" id="usn" required placeholder="1AB22CS001" class="input-field">
          </div>
        </div>

        <div class="form-group">
          <label>College Name</label>
          <input type="text" id="college" placeholder="e.g. IIT Bombay" class="input-field">
        </div>

        <div class="grid-row-2">
          <div class="form-group">
            <label>Branch / Department</label>
            <input type="text" id="branch" placeholder="e.g. CS, ECE" class="input-field">
          </div>
          <div class="form-group">
            <label>Year of Study</label>
            <select id="year" class="input-field">
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year" selected>4th Year</option>
              <option value="Graduated">Graduated</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Error message -->
      <div id="errorBox" class="error-box"></div>

      <!-- Submit button -->
      <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; font-size: 1rem; padding: 0.875rem;">
        Proceed to Setup →
      </button>

      <p style="text-align: center; margin-top: 1.25rem; color: var(--text-secondary); font-size: 0.8rem;">
        Your details are only used to personalize your interview experience.
      </p>
    </form>
  </div>

  <script>
    // Redirect to dashboard if student is already logged in
    const storedUsn = localStorage.getItem('studentUsn');
    if (storedUsn) {
      window.location.href = '/student_dashboard.html';
    }

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ Registering...';
      errorBox.style.display = 'none';

      const payload = {
        studentName: document.getElementById('studentName').value.trim(),
        usn: document.getElementById('usn').value.trim().toUpperCase(),
        college: document.getElementById('college').value.trim(),
        branch: document.getElementById('branch').value.trim(),
        year: document.getElementById('year').value
      };

      try {
        const response = await fetch('/api/student/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok && data.sessionId) {
          // Store details in localStorage
          localStorage.setItem('currentSessionId', data.sessionId);
          localStorage.setItem('studentName', payload.studentName);
          localStorage.setItem('studentUsn', payload.usn);
          localStorage.setItem('studentCollege', payload.college);
          localStorage.setItem('studentBranch', payload.branch);
          
          window.location.href = '/student_introduction.html';
        } else {
          errorBox.textContent = '⚠️ ' + (data.error || 'Failed to register. Please try again.');
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Proceed to Setup →';
        }
      } catch (err) {
        errorBox.textContent = '⚠️ Network error. Please check your connection.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Proceed to Setup →';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — AI Interview Room</title>
  <link rel="stylesheet" href="/student.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--bg-color);
    }
    .login-card {
      padding: 3rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .badge-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto 1rem;
    }
    .input-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }
    .input-field {
      width: 100%;
      padding: 0.875rem;
      border-radius: 0.5rem;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }
    .input-field:focus {
      border-color: var(--accent-primary);
    }
    .error-text {
      color: var(--accent-danger);
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <form id="loginForm" class="glass-panel login-card animate-fade-in-up">
      <div style="margin-bottom: 2rem;">
        <div class="badge-icon">🛡️</div>
        <h2 style="color: var(--text-primary); margin-bottom: 0.5rem;">Admin Portal</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Secure access — authorized personnel only</p>
      </div>

      <div class="input-group">
        <label>Admin Password</label>
        <input type="password" id="password" placeholder="Enter password" required class="input-field">
      </div>

      <div id="errorText" class="error-text"></div>

      <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; font-size: 1rem; padding: 0.875rem;">
        Sign In →
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorText = document.getElementById('errorText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';
      errorText.style.display = 'none';

      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/admin_live_interviews.html';
        } else {
          errorText.textContent = '⚠️ ' + (data.error || 'Login failed');
          errorText.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In →';
        }
      } catch (err) {
        errorText.textContent = '⚠️ Network error. Please try again.';
        errorText.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In →';
      }
    });
  </script>
</body>
</html>

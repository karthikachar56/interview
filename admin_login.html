<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — AI Interview Room</title>
  <link rel="icon" type="image/jpeg" href="/eetirp-icon.jpeg">
  <link rel="stylesheet" href="/student.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--bg-color);
      background-image: var(--bg-gradient);
      padding: 1.5rem;
    }
    .login-card {
      padding: 3.25rem 2.5rem;
      width: 100%;
      max-width: 440px;
      text-align: center;
      background: var(--bg-surface);
      border-radius: 1.75rem;
      box-shadow: var(--neu-flat);
      border: var(--neu-border);
    }
    .badge-icon {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--neu-convex-primary);
      box-shadow: var(--neu-convex-primary-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.85rem;
      margin: 0 auto 1.25rem;
      color: #ffffff;
    }
    .input-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.825rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .error-text {
      color: var(--accent-danger);
      background: #fef2f2;
      border: 1px solid #fecaca;
      box-shadow: var(--neu-inset-sm);
      border-radius: 0.75rem;
      padding: 0.75rem;
      margin-bottom: 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Top Left Logo -->
  <div class="floating-logo">
    <a href="/student_dashboard.html">
      <img src="/eetirp-icon.jpeg" alt="EETIRP Logo">
    </a>
  </div>

  <div class="login-container">
    <form id="loginForm" class="glass-panel login-card animate-fade-in-up">
      <div style="margin-bottom: 2rem;">
        <div class="badge-icon" style="overflow: hidden; display: flex; align-items: center; justify-content: center;">
          <img src="/eetirp-icon.jpeg" style="width: 100%; height: 100%; object-fit: cover;" alt="EETIRP Logo">
        </div>
        <h2 style="color: var(--text-primary); margin-bottom: 0.5rem;">Admin Portal</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Secure access — authorized personnel only</p>
      </div>

      <div class="input-group">
        <label>Admin Password</label>
        <input type="password" id="password" placeholder="Enter password" required class="input-field">
      </div>

      <div id="errorText" class="error-text"></div>

      <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; font-size: 1rem; padding: 0.875rem;">
        Sign In →
      </button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorText = document.getElementById('errorText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';
      errorText.style.display = 'none';

      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/admin_live_interviews.html';
        } else {
          errorText.textContent = '⚠️ ' + (data.error || 'Login failed');
          errorText.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In →';
        }
      } catch (err) {
        errorText.textContent = '⚠️ Network error. Please try again.';
        errorText.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In →';
      }
    });
  </script>
</body>
</html>

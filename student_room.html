<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Mock Interview — Live Room</title>
  <link rel="stylesheet" href="/student.css">
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

</head>
<body>
  <div class="room-container">
    <!-- Admin takeover overlay indicator -->
    <div id="adminTakeoverAlert" style="display: none; background: var(--accent-danger); color: white; text-align: center; padding: 0.5rem; fontWeight: bold; border-radius: 0.5rem; fontSize: 0.875rem; margin-bottom: 0.5rem;">
      ⚠️ Admin has taken over the interview
    </div>

    <!-- Top Header -->
    <div class="room-header glass-panel">
      <div class="header-info">
        <h2 id="roundTitle">Technical Mock Interview</h2>
        <span class="question-badge" id="questionNumBadge">Question 1</span>
      </div>
      <div class="timer" id="roomTimer">00:00</div>
    </div>

    <!-- Main Workspace Grid -->
    <div class="room-grid">
      <!-- Left Panel: Current Question -->
      <div class="left-panel glass-panel animate-fade-in-up">
        <h3>Current Question</h3>
        <p class="question-text" id="questionText">Loading your first question...</p>

        <div id="aiSpeakingIndicator" style="margin-top: auto; padding-top: 1rem; display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.875rem;">
          <span style="display: inline-block; width: 8px; height: 8px; background: var(--accent-secondary); border-radius: 50%; animation: pulse-bg 1.5s infinite;"></span>
          <span id="speakingText">AI is speaking...</span>
        </div>
        <div id="candidateListeningIndicator" style="margin-top: auto; padding-top: 1rem; display: none; align-items: center; gap: 0.5rem; color: var(--accent-primary); font-size: 0.875rem;">
          <span style="display: inline-block; width: 8px; height: 8px; background: var(--accent-primary); border-radius: 50%; animation: pulse-bg 1s infinite;"></span>
          Listening to your answer... (Auto-submits when timer ends)
        </div>
        <div id="answeringTimerIndicator" style="margin-top: 0.5rem; display: none; align-items: center; gap: 0.5rem; color: var(--accent-primary); font-size: 0.875rem;">
          <span style="display: inline-block; width: 8px; height: 8px; background: var(--accent-primary); border-radius: 50%; animation: pulse-bg 1s infinite;"></span>
          ⏱️ Answering time remaining: <strong id="answeringCount" style="color: var(--accent-danger); font-size: 1rem; margin-left: 0.25rem; margin-right: 0.25rem;">90</strong> seconds
        </div>
      </div>

      <!-- Center Panel: Avatar & Video Views -->
      <div class="center-panel glass-panel animate-fade-in-up" style="animation-delay: 0.1s;">
        <!-- AI Interviewer Avatar -->
        <div class="ai-video-container" style="width: 100%; height: 100%;">
          <div class="ai-avatar" id="aiAvatarRing" style="width: 100%; height: 100%; border-radius: 0; border: none; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #0f172a; position: relative;">
            <img id="aiAvatarImg" src="/avatar_idle/frame_0.jpg" style="width: 100%; height: 100%; object-fit: cover; display: block;" alt="AI Interviewer">
          </div>
          <div class="speaking-indicator" id="interviewerStateLabel" style="position: absolute; top: 1rem; left: 1rem; background: rgba(15, 23, 42, 0.7); color: white; padding: 0.35rem 0.85rem; border-radius: 0.5rem; font-size: 0.85rem; font-weight: 600; z-index: 5; border: 1px solid rgba(255, 255, 255, 0.1);">AI Speaking</div>
        </div>

        <!-- Student Self View Camera -->
        <div class="student-video-container">
          <video id="liveVideo" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover; border-radius: 0.5rem;"></video>
          <div id="cameraOffLabel" class="camera-off" style="display: none;">Camera Off</div>
          
          <!-- Screen Share Mini Stream Overlay -->
          <video id="screenVideo" autoplay playsinline muted style="display: none; position: absolute; bottom: 10px; right: 10px; width: 30%; border-radius: 0.25rem; border: 2px solid var(--accent-primary); z-index: 10;"></video>
        </div>
      </div>

      <!-- Right Panel: Live Transcript -->
      <div class="right-panel glass-panel animate-fade-in-up" style="animation-delay: 0.2s;">
        <h3>Live Transcript</h3>
        <div class="transcript-box" id="transcriptBox">
          <!-- Chat bubbles will go here -->
          <div ref="transcriptEnd" id="transcriptEnd"></div>
        </div>

        <!-- Manual fallback text input -->
        <div id="manualInputContainer" style="display: none; margin-top: 1rem;">
          <textarea id="manualInput" placeholder="If your microphone isn't working, you can type your answer here..." style="width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--accent-primary); background: transparent; color: var(--text-primary); min-height: 60px; font-family: inherit; resize: none; outline: none;"></textarea>
        </div>
      </div>
    </div>

    <!-- Hidden snapshot helper canvas -->
    <canvas id="snapshotCanvas" style="display: none;"></canvas>

    <!-- Bottom Controls Bar -->
    <div class="controls-bar glass-panel animate-fade-in-up" style="animation-delay: 0.3s;">
      <div class="control-group">
        <button class="control-btn" id="toggleMicBtn">🎤 Mute</button>
        <button class="control-btn" id="toggleCamBtn">📷 Cam Off</button>
        <button class="control-btn" id="toggleScreenBtn">💻 Share Screen</button>
      </div>

      <div class="control-group center-controls">
        <button class="btn-primary" id="actionBtn" style="display: none;"></button>
      </div>

      <div class="control-group right-controls">
        <button class="btn-danger" id="endBtn" style="padding: 0.75rem 1.5rem;">End Interview</button>
      </div>
    </div>
  </div>

  <script>
    // Authentication guard
    const sessionId = localStorage.getItem('currentSessionId');
    if (!sessionId) {
      window.location.href = '/index.html';
    }

    const round = localStorage.getItem('selectedRound') || 'Technical Mock Interview';
    document.getElementById('roundTitle').textContent = round;

    // State variables
    let questionNum = 1;
    const totalQuestions = 10;
    let timer = 0;
    let micOn = true;
    let camOn = true;
    let isAIActive = true;
    let isRecordingAnswer = false;
    let adminMode = false;
    let isEnding = false;
    let screenShareOn = false;
    let transcript = [];
    let activeStreamType = 'cam'; // 'cam' or 'screen'
    let lipInterval = null;

    // Streams & Refs
    let localStream = null;
    let screenStream = null;
    let peer = null;
    let socket = null;
    let captureTimer = null;
    let lastAdminMessage = "";
    
    // Transcriptions
    let finalTranscription = "";
    let interimTranscription = "";
    let clientVallyMetricsHistory = [];

    // DOM Elements
    const liveVideo = document.getElementById('liveVideo');
    const screenVideo = document.getElementById('screenVideo');
    const cameraOffLabel = document.getElementById('cameraOffLabel');
    const questionNumBadge = document.getElementById('questionNumBadge');
    const roomTimer = document.getElementById('roomTimer');
    const questionText = document.getElementById('questionText');
    const aiSpeakingIndicator = document.getElementById('aiSpeakingIndicator');
    const candidateListeningIndicator = document.getElementById('candidateListeningIndicator');
    const speakingText = document.getElementById('speakingText');
    const interviewerStateLabel = document.getElementById('interviewerStateLabel');
    const aiAvatarRing = document.getElementById('aiAvatarRing');
    // 2D Avatar frame animation variables
    let preloadedIdle = [];
    let preloadedSpeak = [];
    let avatarAnimInterval = null;
    let currentFrameIndex = 0;
    let currentAvatarMode = 'idle';     // tracks current frame set so we don't reset on same-mode call
    let wordLipSyncTimer = null;        // per-word mouth-open timer for exact lip sync
    const TOTAL_FRAMES = 300;
    const FRAME_INTERVAL_MS = 16; // ~60fps
    const transcriptBox = document.getElementById('transcriptBox');
    const transcriptEnd = document.getElementById('transcriptEnd');
    const manualInputContainer = document.getElementById('manualInputContainer');
    const manualInput = document.getElementById('manualInput');
    const toggleMicBtn = document.getElementById('toggleMicBtn');
    const toggleCamBtn = document.getElementById('toggleCamBtn');
    const toggleScreenBtn = document.getElementById('toggleScreenBtn');
    const actionBtn = document.getElementById('actionBtn');
    const endBtn = document.getElementById('endBtn');
    const adminTakeoverAlert = document.getElementById('adminTakeoverAlert');

    // Timer Interval
    const timerInterval = setInterval(() => {
      timer++;
      const m = Math.floor(timer / 60).toString().padStart(2, '0');
      const s = (timer % 60).toString().padStart(2, '0');
      roomTimer.textContent = `${m}:${s}`;
      
      // Auto-end after 10 mins (600s)
      if (timer >= 600 && !isEnding) {
        endInterview();
      }
    }, 1000);

    // Scroll transcript box
    function scrollTranscript() {
      transcriptEnd.scrollIntoView({ behavior: 'smooth' });
    }

    // Speech Recognition Setup
    let recognition = null;
    let isRecognitionRunning = false;
    let hasPermissionError = false;
    let currentQuestionText = "";

    let answeringCountdownInterval = null;
    let answeringCountdownValue = 90;

    function clearAnsweringTimer() {
      if (answeringCountdownInterval) {
        clearInterval(answeringCountdownInterval);
        answeringCountdownInterval = null;
      }
      const ansIndicator = document.getElementById('answeringTimerIndicator');
      if (ansIndicator) ansIndicator.style.display = 'none';
    }

    function startAnsweringPhase() {
      answeringCountdownValue = 90;
      const answeringCountEl = document.getElementById('answeringCount');
      if (answeringCountEl) answeringCountEl.textContent = answeringCountdownValue;
      const answeringIndicator = document.getElementById('answeringTimerIndicator');
      if (answeringIndicator) answeringIndicator.style.display = 'flex';

      if (answeringCountdownInterval) clearInterval(answeringCountdownInterval);
      answeringCountdownInterval = setInterval(() => {
        answeringCountdownValue--;
        if (answeringCountdownValue <= 0) {
          clearInterval(answeringCountdownInterval);
          answeringCountdownInterval = null;
          if (answeringIndicator) answeringIndicator.style.display = 'none';
          // Force submit answer
          handleAutoSubmit(true);
        } else {
          if (answeringCountEl) answeringCountEl.textContent = answeringCountdownValue;
        }
      }, 1000);

      // Start speech recognition immediately
      safeStartRecognition();
    }


    function cleanTTSBleed(transcription, question) {
      if (!question || !transcription) return transcription;
      const cleanStr = (s) => s.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
      const qClean = cleanStr(question);
      const tClean = cleanStr(transcription);
      
      if (!qClean || !tClean) return transcription;
      
      // If the transcription is long and contains the entire question word-for-word, clean it.
      if (tClean.length > 15 && tClean.includes(qClean)) {
        return transcription.substring(transcription.toLowerCase().indexOf(qClean) + qClean.length).trim();
      }
      
      // Only discard if the text matches the question exactly and is a long question (preventing false positives for short answers)
      if (tClean === qClean && qClean.split(/\s+/).length > 3) {
        return "";
      }
      
      return transcription;
    }

    function safeStartRecognition() {
      if (hasPermissionError) return;
      if (recognition && micOn && !isEnding) {
        try {
          recognition.start();
          isRecognitionRunning = true;
        } catch(e) {
          // If already started, mark as running and bypass the error
          if (e.name === 'InvalidStateError' || (e.message && e.message.includes('already started'))) {
            isRecognitionRunning = true;
          } else {
            console.warn("safeStartRecognition error:", e);
          }
        }
      }
    }

    function safeStopRecognition() {
      if (recognition) {
        try {
          recognition.stop();
        } catch(e) {
          console.warn("safeStopRecognition error:", e);
        }
        isRecognitionRunning = false;
      }
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        console.warn('Speech Recognition not supported in this browser.');
        return;
      }
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isRecognitionRunning = true;
        hasPermissionError = false;
      };

      recognition.onresult = (event) => {
        // Ignore everything while AI is active (speaking)
        if (isAIActive) return;

        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript + ' ';
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        
        if (final) {
          const cleanedFinal = cleanTTSBleed(final, currentQuestionText);
          if (cleanedFinal) {
            finalTranscription += cleanedFinal;
          }
        }
        interimTranscription = cleanTTSBleed(interim, currentQuestionText);
        syncDraft(finalTranscription + interimTranscription);
        renderTranscriptBubbles();
      };

      recognition.onerror = (event) => {
        if (event.error !== 'aborted') {
          console.error("Speech Recognition error:", event.error);
        }
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          hasPermissionError = true;
        }
        // Restart if it crashes or drops (and no permission error)
        if (!isEnding && micOn && !hasPermissionError) {
          setTimeout(() => {
            safeStartRecognition();
          }, 1000);
        }
      };

      recognition.onend = () => {
        isRecognitionRunning = false;
        // Restart mic continuously to keep it warm
        if (!isEnding && micOn && !hasPermissionError) {
          safeStartRecognition();
        }
      };

      // Start immediately — mic is always on
      try { recognition.start(); } catch(e){}
    }

    // Speech Synthesis
    let currentUtterance = null;
    let _ttsGcGuard = []; // prevents Chrome GC from destroying utterance mid-speech

    function speakAndListen(text) {
      isAIActive = true;
      isRecordingAnswer = false;
      currentQuestionText = text;
      // Start with idle mouth — onstart will open it precisely when audio begins
      startAvatarLoop('idle');
      updateIndicatorUI();

      if (!('speechSynthesis' in window)) {
        isAIActive = false;
        updateIndicatorUI();
        if (text.includes("concludes our interview questions") || questionNum > totalQuestions) endInterview();
        else startListening();
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      // Prioritize local English male voices to ensure a zero-latency male interviewer voice
      const maleIndicators = ['male', 'david', 'daniel', 'alex', 'mark', 'george', 'ravi', 'sean', 'james', 'richard', 'thomas', 'guy'];
      const englishVoices = voices.filter(v => v.lang.startsWith('en'));
      
      let chosenVoice = englishVoices.find(v => 
        v.localService === true && 
        maleIndicators.some(ind => v.name.toLowerCase().includes(ind))
      );
      
      if (!chosenVoice) {
        chosenVoice = englishVoices.find(v => 
          maleIndicators.some(ind => v.name.toLowerCase().includes(ind))
        );
      }
      
      if (!chosenVoice) {
        chosenVoice = englishVoices.find(v => v.localService === true);
      }
      
      const usVoice = chosenVoice || englishVoices[0] || voices[0];
      if (usVoice) utterance.voice = usVoice;
      utterance.rate = 0.88; // Slightly slower speaking rate for better clarity
      utterance.pitch = 1.0;

      // GC guard — prevents Chrome GC from destroying utterance mid-speech
      currentUtterance = utterance;
      _ttsGcGuard.push(utterance);
      if (_ttsGcGuard.length > 5) _ttsGcGuard.shift();

      let done = false;
      let boundaryTimer = null;
      let fallbackTimer = null;
      let boundaryEverFired = false;
      let lastBoundaryTime = 0; // track timing between word boundaries for pause detection

      // ── Helper: clean up lip sync state ──────────────────────────────────
      function cleanupLipSync() {
        if (wordLipSyncTimer) { clearTimeout(wordLipSyncTimer); wordLipSyncTimer = null; }
        startAvatarLoop('idle');
      }

      // ── Transition out of AI speaking state ──────────────────────────────
      const activate = (force = false) => {
        if (done) return;
        if (!force && window.speechSynthesis.speaking) {
          setTimeout(() => activate(false), 200);
          return;
        }
        done = true;
        if (boundaryTimer) clearTimeout(boundaryTimer);
        if (fallbackTimer) clearTimeout(fallbackTimer);
        cleanupLipSync();
        isAIActive = false;
        updateIndicatorUI();
        if (text.includes("concludes our interview questions") || questionNum > totalQuestions) {
          endInterview();
        } else {
          startListening();
        }
      };

      // Layer 1: onstart — opens mouth precisely when TTS audio begins
      let onstartFired = false;
      utterance.onstart = () => {
        if (onstartFired) return;
        onstartFired = true;
        startAvatarLoop('speak');
        lastBoundaryTime = performance.now();
      };

      // Safety fallback if onstart is delayed/unsupported
      setTimeout(() => {
        if (!onstartFired && isAIActive && !done) {
          onstartFired = true;
          startAvatarLoop('speak');
          lastBoundaryTime = performance.now();
        }
      }, 300);

      utterance.onend   = () => activate(true);
      utterance.onerror = () => activate(true);

      // ── Word-boundary lip sync ─────────────────────────────────────────
      // Strategy: keep mouth OPEN (speak mode) during continuous speech.
      // Only briefly close mouth (idle) when a natural pause is detected
      // (gap > 200ms between word boundaries, e.g. comma/period pauses).
      // This creates smooth, natural lip movement synced to every question.
      utterance.onboundary = (event) => {
        boundaryEverFired = true;

        if (event.name === 'word') {
          const now = performance.now();
          const gap = now - lastBoundaryTime;
          lastBoundaryTime = now;

          // If there was a noticeable pause (punctuation, breath), do a brief mouth close
          if (gap > 200 && currentAvatarMode === 'speak') {
            // Brief close for the pause, then reopen
            startAvatarLoop('idle');
            if (wordLipSyncTimer) clearTimeout(wordLipSyncTimer);
            wordLipSyncTimer = setTimeout(() => {
              if (!done && isAIActive) {
                startAvatarLoop('speak');
              }
              wordLipSyncTimer = null;
            }, 80); // very brief close — just enough to simulate a natural pause
          } else {
            // Continuous speech — keep mouth open
            if (currentAvatarMode !== 'speak') {
              startAvatarLoop('speak');
            }
            // Cancel any pending close timer
            if (wordLipSyncTimer) { clearTimeout(wordLipSyncTimer); wordLipSyncTimer = null; }
          }

          // Set a close timer in case no more boundaries fire (end of sentence)
          wordLipSyncTimer = setTimeout(() => {
            if (!done && isAIActive && window.speechSynthesis.speaking) {
              // Still speaking but no new word boundary — keep mouth open
              // (the TTS engine might be on a long word)
            } else if (!done && isAIActive) {
              startAvatarLoop('idle');
            }
            wordLipSyncTimer = null;
          }, 500);
        }

        // ── Rolling activation timer (speech-end detection) ──
        // Increased from 350ms to 800ms to prevent premature end detection
        if (boundaryTimer) clearTimeout(boundaryTimer);
        boundaryTimer = setTimeout(() => activate(true), 800);
      };

      // Fallback: if onboundary never fires (some browsers), run continuous speak loop
      setTimeout(() => {
        if (!boundaryEverFired && isAIActive && !done) {
          startAvatarLoop('speak');
        }
      }, 900);

      // Layer 3: char-count hard fallback (recovers from Chrome speech hangs)
      const speechMs = Math.max(1500, text.length * 65);
      fallbackTimer = setTimeout(() => activate(true), speechMs + 500);

      window.speechSynthesis.speak(utterance);
    }

    function startListening() {
      if (!micOn) return;
      finalTranscription = '';
      interimTranscription = '';
      manualInput.value = '';
      isRecordingAnswer = true;
      updateIndicatorUI();
      
      // Reset permission error state on new question to try and reconnect mic
      hasPermissionError = false;

      startAnsweringPhase();
    }

    function updateIndicatorUI() {
      if (isAIActive) {
        // Do NOT reset mouth here — let TTS onstart/onboundary events control lip sync
        // The avatar mode is managed by speakAndListen() directly
        aiSpeakingIndicator.style.display = 'flex';
        candidateListeningIndicator.style.display = 'none';
        clearAnsweringTimer();
        
        speakingText.textContent = adminMode ? "Admin is speaking..." : "AI is speaking...";
        interviewerStateLabel.textContent = adminMode ? "Admin Speaking" : "AI Speaking";
        aiAvatarRing.classList.add('active-speaking', 'animate-pulse-ring');
        
        actionBtn.style.display = 'inline-flex';
        actionBtn.style.background = 'var(--accent-secondary)';
        actionBtn.innerHTML = '🛑 Stop AI & Speak';
      } else if (isRecordingAnswer) {
        startAvatarLoop('idle');
        aiSpeakingIndicator.style.display = 'none';
        candidateListeningIndicator.style.display = 'flex';
        interviewerStateLabel.textContent = "Listening...";
        aiAvatarRing.classList.remove('active-speaking', 'animate-pulse-ring');
        
        actionBtn.style.display = 'inline-flex';
        actionBtn.style.background = 'linear-gradient(135deg, var(--accent-primary), var(--accent-secondary))';
        actionBtn.innerHTML = '✅ Submit Answer';
        
        manualInputContainer.style.display = 'block';
      } else {
        startAvatarLoop('idle');
        aiSpeakingIndicator.style.display = 'none';
        candidateListeningIndicator.style.display = 'none';
        clearAnsweringTimer();
        
        interviewerStateLabel.textContent = "Standby";
        aiAvatarRing.classList.remove('active-speaking', 'animate-pulse-ring');
        actionBtn.style.display = 'none';
        manualInputContainer.style.display = 'none';
      }
    }

    const PRELOAD_COUNT = 300; // Preload all 300 frames to run animation fully in-memory with zero network requests during playback

    // Preload first 200 idle and 200 speak frames into Image objects
    function preloadAvatarFrames() {
      for (let i = 0; i < TOTAL_FRAMES; i++) {
        preloadedIdle.push(null);
        preloadedSpeak.push(null);
      }
      
      startAvatarLoop('idle');
      
      let loadIndex = 0;
      function loadNextBatch() {
        if (loadIndex >= PRELOAD_COUNT) return;
        const batchSize = 10;
        for (let j = 0; j < batchSize && (loadIndex + j) < PRELOAD_COUNT; j++) {
          const idx = loadIndex + j;
          
          const idleImg = new Image();
          idleImg.onload = () => {
            preloadedIdle[idx] = idleImg;
          };
          idleImg.src = `/avatar_idle/frame_${idx}.jpg`;

          const speakImg = new Image();
          speakImg.onload = () => {
            preloadedSpeak[idx] = speakImg;
          };
          speakImg.src = `/avatar_speak/frame_${idx}.jpg`;
        }
        loadIndex += batchSize;
        setTimeout(loadNextBatch, 80); // Gentler pacing to avoid blocking browser connection pool
      }
      loadNextBatch();
    }

    function startAvatarLoop(mode, force) {
      // Allow forced re-entry for the same mode (needed for lip sync toggle back)
      if (!force && mode === currentAvatarMode && avatarAnimInterval) return;

      if (avatarAnimInterval) {
        clearInterval(avatarAnimInterval);
        avatarAnimInterval = null;
      }
      currentAvatarMode = mode;
      const avatarImg = document.getElementById('aiAvatarImg');
      if (!avatarImg) return;
      
      avatarAnimInterval = setInterval(() => {
        const frames = (mode === 'speak') ? preloadedSpeak : preloadedIdle;
        const cached = frames[currentFrameIndex];
        if (cached && cached.complete) {
          avatarImg.src = cached.src;
        } else {
          avatarImg.src = (mode === 'speak')
            ? `/avatar_speak/frame_${currentFrameIndex}.jpg`
            : `/avatar_idle/frame_${currentFrameIndex}.jpg`;
        }
        currentFrameIndex = (currentFrameIndex + 1) % TOTAL_FRAMES;
      }, FRAME_INTERVAL_MS);
    }
    function renderTranscriptBubbles() {
      // Clear all dynamic bubbles, keeping only completed ones plus the live bubble if recording
      const bubbles = transcriptBox.querySelectorAll('.chat-bubble');
      bubbles.forEach(b => b.remove());

      transcript.forEach(msg => {
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble ${msg.role}`;
        
        const label = msg.role === 'ai' ? 'AI Interviewer' : msg.role === 'admin' ? '👤 Admin' : 'You';
        bubble.innerHTML = `<strong>${label}: </strong><span>${escapeHTML(msg.text)}</span>`;
        transcriptBox.insertBefore(bubble, transcriptEnd);
      });

      if (isRecordingAnswer) {
        const liveBubble = document.createElement('div');
        liveBubble.className = 'chat-bubble student recording-pulse';
        const typedPart = manualInput.value.trim();
        const spokenPart = (finalTranscription + interimTranscription).trim();
        const composite = [spokenPart, typedPart].filter(Boolean).join(' | ') || '🎙 Listening...';
        liveBubble.innerHTML = `<em>${escapeHTML(composite)}</em>`;
        transcriptBox.insertBefore(liveBubble, transcriptEnd);
      }
      scrollTranscript();
    }

    function escapeHTML(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Auto-Submit Logic
    async function handleAutoSubmit(forceSubmit = false) {
      if (!isRecordingAnswer) return;

      const typedAnswer = manualInput.value.trim();
      const spokenAnswer = (finalTranscription + ' ' + interimTranscription).trim();
      const studentAnswer = [spokenAnswer, typedAnswer].filter(Boolean).join(' ').trim();

      if (!studentAnswer && !forceSubmit) {
        // No input, keep listening
        startListening();
        return;
      }

      clearAnsweringTimer();
      
      manualInput.value = "";
      isRecordingAnswer = false;
      isAIActive = true;
      updateIndicatorUI();

      transcript.push({ role: 'student', text: studentAnswer });
      finalTranscription = '';
      interimTranscription = '';
      syncDraft("");
      renderTranscriptBubbles();

      if (adminMode) {
        questionText.textContent = "Waiting for admin's next question...";
        await fetch('/api/interview/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, studentAnswer })
        });
        isAIActive = false;
        updateIndicatorUI();
      } else {
        questionText.textContent = "Loading next question...";
        try {
          const savedQuestions = localStorage.getItem('selectedQuestions');
          const selectedQuestions = savedQuestions ? JSON.parse(savedQuestions) : null;
          
          const res = await fetch('/api/interview/answer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, answer: studentAnswer, history: transcript, selectedQuestions })
          });
          const data = await res.json();
          
          questionText.textContent = data.question;
          transcript.push({ role: 'ai', text: data.question });
          questionNum++;
          questionNumBadge.textContent = `Question ${questionNum}`;
          
          // Start speaking the next question after a brief delay (1.5s) to slow down transition pace
          setTimeout(() => {
            if (!isEnding) {
              speakAndListen(data.question);
            }
          }, 1500);

          // Run evaluation in the background during AI speech to avoid latency
          const prevAIIndex = transcript.length - 3;
          const prevAIQuestion = prevAIIndex >= 0 ? transcript[prevAIIndex].text : "Unknown question";
          
          fetch('/api/interview/evaluate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, answer: studentAnswer, question: prevAIQuestion })
          })
          .then(evalRes => evalRes.json())
          .then(evalData => {
            if (evalData.metrics) {
              clientVallyMetricsHistory.push(evalData.metrics);
            }
            if (evalData.correctedText) {
              // Dynamically correct the student transcript bubble with high-accuracy text
              const msg = transcript.find(m => m.role === 'student' && m.text === studentAnswer);
              if (msg) {
                msg.text = evalData.correctedText;
                renderTranscriptBubbles();
              }
            }
          })
          .catch(evalErr => {
            console.error("Background evaluation failed:", evalErr);
          });
        } catch (err) {
          console.error("Failed to fetch next question:", err);
          isAIActive = false;
          startListening();
        }
      }
    }

    // Stop AI & Speak / Submit Button click
    actionBtn.addEventListener('click', () => {
      if (isAIActive) {
        // Stop speaking and immediately listen
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        isAIActive = false;
        startListening();
      } else if (isRecordingAnswer) {
        handleAutoSubmit(true);
      }
    });

    // WebSockets & Previews
    function initWebSocket() {
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsHost = window.location.host || 'localhost:3000';
      const wsUrl = `${wsProtocol}//${wsHost}/ws`;
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        console.log('WS Connection established');
        socket.send(JSON.stringify({
          type: 'register',
          role: 'candidate',
          id: sessionId
        }));
        syncDraft("");
      };

      socket.onclose = () => {
        console.warn('WS Connection closed, retrying in 3s...');
        setTimeout(initWebSocket, 3000);
      };

      socket.onerror = (err) => {
        console.error("WS error:", err);
      };
    }

    function syncDraft(text) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          type: 'draft',
          text: text
        }));
      }
    }

    // Screen snapshot capture and socket streaming
    function sendSnapshot() {
      if (!localStream) return;
      const targetVideo = screenShareOn ? screenVideo : liveVideo;
      
      const canvas = document.getElementById('snapshotCanvas');
      const ctx = canvas.getContext('2d');
      const w = 400;
      const h = Math.round((targetVideo.videoHeight / targetVideo.videoWidth) * w) || 300;
      canvas.width = w;
      canvas.height = h;

      try {
        ctx.drawImage(targetVideo, 0, 0, w, h);
        const base64 = canvas.toDataURL('image/jpeg', 0.5);

        // Send over WebSocket if connected
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({
            type: 'preview',
            previewType: activeStreamType,
            image: base64
          }));
        }

        // POST fallback REST sync
        fetch(`/api/preview/${encodeURIComponent(sessionId)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64, type: activeStreamType })
        }).catch(() => {});
      } catch (err) {
        console.warn('Preview capture failed:', err);
      }
    }

    // Init Media Devices (Webcam)
    async function initMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, frameRate: 15 },
          audio: true
        });
        liveVideo.srcObject = localStream;
        liveVideo.style.display = 'block';
        cameraOffLabel.style.display = 'none';

        // Connect PeerJS
        peer = new Peer(`student-${sessionId}`);
        peer.on('open', id => console.log('PeerJS candidate registered:', id));
        peer.on('call', call => call.answer(localStream));

        // Start snapshot timer
        captureTimer = setInterval(sendSnapshot, 1500);
      } catch (err) {
        console.error("Error accessing webcam/microphone:", err);
        cameraOffLabel.textContent = "Camera Blocked";
        cameraOffLabel.style.display = 'block';
        liveVideo.style.display = 'none';
      }
    }

    // Toggle Mic
    toggleMicBtn.addEventListener('click', () => {
      const tracks = localStream ? localStream.getAudioTracks() : [];
      if (tracks.length) {
        micOn = !micOn;
        tracks[0].enabled = micOn;
        toggleMicBtn.textContent = micOn ? '🎤 Mute' : '🔇 Unmute';
        toggleMicBtn.className = `control-btn ${!micOn ? 'danger' : ''}`;
        if (!micOn) {
          safeStopRecognition();
        } else if (micOn && isRecordingAnswer) {
          safeStartRecognition();
        }
      }
    });

    // Toggle Cam
    toggleCamBtn.addEventListener('click', () => {
      const tracks = localStream ? localStream.getVideoTracks() : [];
      if (tracks.length) {
        camOn = !camOn;
        tracks[0].enabled = camOn;
        toggleCamBtn.textContent = camOn ? '📷 Cam Off' : '📸 Cam On';
        toggleCamBtn.className = `control-btn ${!camOn ? 'danger' : ''}`;
        liveVideo.style.display = camOn ? 'block' : 'none';
        cameraOffLabel.style.display = camOn ? 'none' : 'block';
        cameraOffLabel.textContent = 'Camera Off';
      }
    });

    // Share Screen
    toggleScreenBtn.addEventListener('click', async () => {
      if (screenShareOn) {
        if (screenStream) {
          screenStream.getTracks().forEach(t => t.stop());
          screenStream = null;
        }
        screenVideo.srcObject = null;
        screenVideo.style.display = 'none';
        screenShareOn = false;
        activeStreamType = 'cam';
        toggleScreenBtn.textContent = '💻 Share Screen';
        toggleScreenBtn.classList.remove('active');
        toggleScreenBtn.style.background = '';
        toggleScreenBtn.style.color = '';
      } else {
        try {
          screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
          screenVideo.srcObject = screenStream;
          screenVideo.style.display = 'block';
          screenShareOn = true;
          activeStreamType = 'screen';
          
          toggleScreenBtn.textContent = 'Stop Share';
          toggleScreenBtn.style.background = 'var(--accent-primary)';
          toggleScreenBtn.style.color = 'white';

          // Call admin over Peer if active
          if (peer) {
            peer.call(`admin-${sessionId}`, screenStream, { metadata: { type: 'screen' } });
          }

          // Monitor sharing stop from system banner
          screenStream.getVideoTracks()[0].onended = () => {
            screenVideo.srcObject = null;
            screenVideo.style.display = 'none';
            screenShareOn = false;
            activeStreamType = 'cam';
            toggleScreenBtn.textContent = '💻 Share Screen';
            toggleScreenBtn.style.background = '';
            toggleScreenBtn.style.color = '';
            screenStream = null;
          };
        } catch (err) {
          console.error("Screen Share cancelled/failed:", err);
        }
      }
    });

    // Poll for Admin Takeover & Messages
    const takeoverPoll = setInterval(async () => {
      try {
        const res = await fetch(`/api/interview/sync?sessionId=${sessionId}`);
        const data = await res.json();
        if (data.session) {
          if (data.session.status === 'completed') {
            clearInterval(takeoverPoll);
            window.location.href = `/student_report.html?sessionId=${encodeURIComponent(sessionId)}`;
            return;
          }
          adminMode = data.session.mode === 'admin';
          if (adminMode) {
            adminTakeoverAlert.style.display = 'block';
            
            if (data.session.adminMessage && data.session.adminMessage !== lastAdminMessage) {
              lastAdminMessage = data.session.adminMessage;
              questionText.textContent = data.session.adminMessage;
              transcript.push({ role: 'admin', text: data.session.adminMessage });
              speakAndListen(data.session.adminMessage);
            }
          } else {
            adminTakeoverAlert.style.display = 'none';
          }
          updateIndicatorUI();
        }
      } catch (err) {
        console.warn("Poll failed:", err);
      }
    }, 3000);

    // Initial load
    async function startInterview() {
      try {
        const res = await fetch('/api/interview/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId })
        });
        const data = await res.json();
        if (data.round) {
          document.getElementById('roundTitle').textContent = data.round;
        }
        if (data.selectedQuestions) {
          localStorage.setItem('selectedQuestions', JSON.stringify(data.selectedQuestions));
        }
        questionText.textContent = data.question;
        transcript.push({ role: 'ai', text: data.question });
        renderTranscriptBubbles();
        // Start speaking first question after a brief delay (1.5s)
        setTimeout(() => {
          if (!isEnding) {
            speakAndListen(data.question);
          }
        }, 1500);
      } catch (err) {
        console.error("Failed to start session:", err);
        questionText.textContent = "Could not load question. Please reload.";
      }
    }

    // End Interview
    async function endInterview() {
      if (isEnding) return;
      isEnding = true;
      
      clearInterval(timerInterval);
      clearInterval(takeoverPoll);
      if (captureTimer) clearInterval(captureTimer);

      questionText.textContent = "Generating your scorecard...";
      interviewerStateLabel.textContent = "Evaluating...";
      
      safeStopRecognition();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      
      // Stop media tracks safely
      try {
        if (localStream && typeof localStream.getTracks === 'function') {
          localStream.getTracks().forEach(track => {
            try { track.stop(); } catch(e){}
          });
        }
      } catch (err) {
        console.warn("Error stopping local stream tracks:", err);
      }

      try {
        if (screenStream && typeof screenStream.getTracks === 'function') {
          screenStream.getTracks().forEach(track => {
            try { track.stop(); } catch(e){}
          });
        }
      } catch (err) {
        console.warn("Error stopping screen stream tracks:", err);
      }

      try {
        if (peer && typeof peer.destroy === 'function') {
          peer.destroy();
        }
      } catch (err) {
        console.warn("Error destroying peer:", err);
      }

      try {
        // Fire-and-forget background fetch with keepalive to allow instant redirect
        fetch('/api/interview/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, transcript: transcript, vallyMetricsHistory: clientVallyMetricsHistory }),
          keepalive: true
        }).catch(err => console.error("Failed to log completion background fetch:", err));
      } catch (err) {
        console.error("Failed to log completion:", err);
      }

      window.location.href = `/student_report.html?sessionId=${encodeURIComponent(sessionId)}`;
    }

    endBtn.addEventListener('click', () => {
      endInterview();
    });

    // Sync input events for manual typing
    manualInput.addEventListener('input', () => {
      renderTranscriptBubbles();
      
      // Stop speech recognition when manual typing starts
      safeStopRecognition();
      
      // Sync manual typing draft
      syncDraft(manualInput.value);
    });

    // Execute Initializations
    window.speechSynthesis.onvoiceschanged = () => {
      // Re-trigger voice lists loading
    };
    
    initWebSocket();
    preloadAvatarFrames();
    initMedia().then(() => {
      initSpeechRecognition();
      startInterview();
    });
  </script>
</body>
</html>

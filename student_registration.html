<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — AI Interview Room</title>
  <link rel="icon" type="image/jpeg" href="/eetirp-icon.jpeg">
  <link rel="stylesheet" href="/student.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
    }
    .login-form {
      padding: 2.75rem 2.25rem;
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      border-radius: 1.5rem;
      background: var(--bg-surface);
      box-shadow: var(--neu-flat);
      border: var(--neu-border);
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .avatar-icon {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      margin: 0 auto 1.25rem;
      background: var(--neu-convex-primary);
      box-shadow: var(--neu-convex-primary-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.85rem;
      color: #ffffff;
    }
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 1.75rem;
    }
    .grid-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .error-box {
      padding: 0.85rem 1rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      box-shadow: var(--neu-inset-sm);
      border-radius: 0.75rem;
      margin-bottom: 1.25rem;
      color: var(--accent-danger);
      font-size: 0.875rem;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Top Left Logo -->
  <div class="floating-logo">
    <a href="/student_dashboard.html">
      <img src="/eetirp-icon.jpeg" alt="EETIRP Logo">
    </a>
  </div>

  <div class="login-container">
    <form id="loginForm" class="glass-panel login-form animate-fade-in-up">
      <!-- Header -->
      <div class="header">
        <div class="avatar-icon">🎓</div>
        <h2 id="formTitle">Student Log In</h2>
        <p id="formDesc" style="margin-top: 0.25rem;">Enter your SRN to access your dashboard</p>
      </div>

      <!-- Tabs -->
      <div class="tabs-container">
        <button type="button" id="tabLogin" class="tab-btn active">Log In</button>
        <button type="button" id="tabRegister" class="tab-btn">Register</button>
      </div>

      <!-- Input Fields -->
      <div class="form-grid">
        <div class="grid-row-2" id="nameSrnRow" style="grid-template-columns: 1fr;">
          <div class="form-group" id="groupName" style="display: none;">
            <label>Full Name *</label>
            <input type="text" id="studentName" placeholder="John Doe" class="input-field">
          </div>
          <div class="form-group" id="groupSrn">
            <label>SRN *</label>
            <input type="text" id="srn" required placeholder="PES1UG22CS001" class="input-field">
          </div>
        </div>

        <div class="form-group" id="groupPassword">
          <label>Password *</label>
          <input type="password" id="password" required placeholder="••••••••" class="input-field">
        </div>

        <div id="registrationFields" style="display: none; flex-direction: column; gap: 1.25rem;">
          <div class="form-group">
            <label>College Name</label>
            <input type="text" id="college" placeholder="e.g. IIT Bombay" class="input-field">
          </div>

          <div class="grid-row-2">
            <div class="form-group">
              <label>Branch / Department</label>
              <select id="branch" class="input-field">
                <option value="" disabled selected>Select Branch</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Electronics & Communication">Electronics & Communication</option>
                <option value="Information Science">Information Science</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Civil Engineering">Civil Engineering</option>
                <option value="Electrical & Electronics">Electrical & Electronics</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label>Year of Study</label>
              <select id="year" class="input-field">
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year" selected>4th Year</option>
                <option value="Graduated">Graduated</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Error message -->
      <div id="errorBox" class="error-box"></div>

      <!-- Submit button -->
      <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; font-size: 1rem; padding: 0.875rem;">
        Log In →
      </button>

      <p style="text-align: center; margin-top: 1.25rem; color: var(--text-secondary); font-size: 0.8rem;">
        Your details are only used to personalize your interview experience.
      </p>
    </form>
  </div>

  <script>
    // Redirect to dashboard if student is already logged in
    const storedSrn = localStorage.getItem('studentSrn') || localStorage.getItem('studentUsn');
    if (storedSrn) {
      // Migrate legacy studentUsn if present
      if (!localStorage.getItem('studentSrn') && localStorage.getItem('studentUsn')) {
        localStorage.setItem('studentSrn', localStorage.getItem('studentUsn'));
      }
      window.location.href = '/student_dashboard.html';
    }

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');

    const tabRegister = document.getElementById('tabRegister');
    const tabLogin = document.getElementById('tabLogin');
    const groupName = document.getElementById('groupName');
    const registrationFields = document.getElementById('registrationFields');
    const nameSrnRow = document.getElementById('nameSrnRow');
    const studentNameInput = document.getElementById('studentName');
    const formTitle = document.getElementById('formTitle');
    const formDesc = document.getElementById('formDesc');

    let mode = 'login';

    tabRegister.addEventListener('click', () => {
      mode = 'register';
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      formTitle.textContent = 'Student Registration';
      formDesc.textContent = 'Enter your details to begin the AI mock interview';
      
      groupName.style.display = 'block';
      studentNameInput.required = true;
      nameSrnRow.style.gridTemplateColumns = '1fr 1fr';
      registrationFields.style.display = 'flex';
      submitBtn.textContent = 'Proceed to Setup →';
    });

    tabLogin.addEventListener('click', () => {
      mode = 'login';
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      formTitle.textContent = 'Student Log In';
      formDesc.textContent = 'Enter your SRN to access your dashboard';
      
      groupName.style.display = 'none';
      studentNameInput.required = false;
      nameSrnRow.style.gridTemplateColumns = '1fr';
      registrationFields.style.display = 'none';
      submitBtn.textContent = 'Log In →';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ Processing...';
      errorBox.style.display = 'none';

      const srnVal = document.getElementById('srn').value.trim().toUpperCase();
      const passwordVal = document.getElementById('password').value.trim();
      if (!srnVal || !passwordVal) {
        errorBox.textContent = '⚠️ SRN and Password are required.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = mode === 'login' ? 'Log In →' : 'Proceed to Setup →';
        return;
      }

      if (mode === 'login') {
        try {
          const res = await fetch('/api/student/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ srn: srnVal, password: passwordVal })
          });

          if (!res.ok) {
            const data = await res.json();
            throw new Error(data.error || 'Login failed.');
          }

          const data = await res.json();
          // Store details in localStorage
          localStorage.setItem('studentName', data.studentName);
          localStorage.setItem('studentSrn', data.srn);
          localStorage.setItem('studentUsn', data.srn);
          localStorage.setItem('studentPassword', passwordVal);
          localStorage.setItem('studentCollege', data.college || '');
          localStorage.setItem('studentBranch', data.branch || '');
          localStorage.setItem('studentYear', data.year || '4th Year');

          window.location.href = '/student_dashboard.html';
        } catch (err) {
          errorBox.textContent = `⚠️ ${err.message}`;
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log In →';
        }
      } else {
        const nameVal = studentNameInput.value.trim();
        if (!nameVal) {
          errorBox.textContent = '⚠️ Full Name is required.';
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Proceed to Setup →';
          return;
        }

        // Register profile immediately on the backend
        const collegeVal = document.getElementById('college').value.trim();
        const branchVal = document.getElementById('branch').value.trim();
        const yearVal = document.getElementById('year').value;

        try {
          const res = await fetch('/api/student/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              studentName: nameVal,
              srn: srnVal,
              college: collegeVal,
              branch: branchVal,
              year: yearVal,
              password: passwordVal
            })
          });

          if (!res.ok) {
            const data = await res.json();
            throw new Error(data.error || 'Registration failed.');
          }

          const data = await res.json();
          // Store details in localStorage
          localStorage.setItem('studentName', nameVal);
          localStorage.setItem('studentSrn', srnVal);
          localStorage.setItem('studentUsn', srnVal);
          localStorage.setItem('studentPassword', passwordVal);
          localStorage.setItem('studentCollege', collegeVal);
          localStorage.setItem('studentBranch', branchVal);
          localStorage.setItem('studentYear', yearVal);
          localStorage.setItem('currentSessionId', data.sessionId);

          window.location.href = '/student_introduction.html';
        } catch (err) {
          errorBox.textContent = `⚠️ ${err.message}`;
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Proceed to Setup →';
        }
      }
    });
  </script>
</body>
</html>

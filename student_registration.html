<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — AI Interview Room</title>
  <link rel="stylesheet" href="/student.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .login-form {
      padding: 2.5rem;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
    }
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .avatar-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 1.75rem;
    }
    .grid-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.375rem;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.04);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      border-color: var(--accent-primary);
      background: #ffffff;
    }
    select.input-field {
      background: rgba(15, 23, 42, 0.04);
      color: var(--text-primary);
      cursor: pointer;
    }
    select.input-field option {
      background-color: #ffffff;
      color: var(--text-primary);
    }
    .error-box {
      padding: 0.75rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 0.5rem;
      margin-bottom: 1.25rem;
      color: var(--accent-danger);
      font-size: 0.875rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <form id="loginForm" class="glass-panel login-form animate-fade-in-up">
      <!-- Header -->
      <div class="header">
        <div class="avatar-icon">🎓</div>
        <h2>Student Registration</h2>
        <p style="margin-top: 0.25rem;">Enter your details to begin the AI mock interview</p>
      </div>

      <!-- Input Fields -->
      <div class="form-grid">
        <div class="grid-row-2">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="studentName" required placeholder="John Doe" class="input-field">
          </div>
          <div class="form-group">
            <label>SRN *</label>
            <input type="text" id="srn" required placeholder="PES1UG22CS001" class="input-field">
          </div>
        </div>

        <div class="form-group">
          <label>College Name</label>
          <input type="text" id="college" placeholder="e.g. IIT Bombay" class="input-field">
        </div>

        <div class="grid-row-2">
          <div class="form-group">
            <label>Branch / Department</label>
            <select id="branch" class="input-field">
              <option value="" disabled selected>Select Branch</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Electronics & Communication">Electronics & Communication</option>
              <option value="Information Science">Information Science</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Civil Engineering">Civil Engineering</option>
              <option value="Electrical & Electronics">Electrical & Electronics</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Year of Study</label>
            <select id="year" class="input-field">
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year" selected>4th Year</option>
              <option value="Graduated">Graduated</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Error message -->
      <div id="errorBox" class="error-box"></div>

      <!-- Submit button -->
      <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; font-size: 1rem; padding: 0.875rem;">
        Proceed to Setup →
      </button>

      <p style="text-align: center; margin-top: 1.25rem; color: var(--text-secondary); font-size: 0.8rem;">
        Your details are only used to personalize your interview experience.
      </p>
    </form>
  </div>

  <script>
    // Redirect to dashboard if student is already logged in
    const storedSrn = localStorage.getItem('studentSrn') || localStorage.getItem('studentUsn');
    if (storedSrn) {
      // Migrate legacy studentUsn if present
      if (!localStorage.getItem('studentSrn') && localStorage.getItem('studentUsn')) {
        localStorage.setItem('studentSrn', localStorage.getItem('studentUsn'));
      }
      window.location.href = '/student_dashboard.html';
    }

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ Processing...';
      errorBox.style.display = 'none';

      const payload = {
        studentName: document.getElementById('studentName').value.trim(),
        srn: document.getElementById('srn').value.trim().toUpperCase(),
        college: document.getElementById('college').value.trim(),
        branch: document.getElementById('branch').value.trim(),
        year: document.getElementById('year').value
      };

      if (!payload.studentName || !payload.srn) {
        errorBox.textContent = '⚠️ Full Name and SRN are required.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Proceed to Setup →';
        return;
      }

      // Store details in localStorage
      localStorage.setItem('studentName', payload.studentName);
      localStorage.setItem('studentSrn', payload.srn);
      localStorage.setItem('studentUsn', payload.srn); // Deprecated legacy fallback
      localStorage.setItem('studentCollege', payload.college);
      localStorage.setItem('studentBranch', payload.branch);
      localStorage.setItem('studentYear', payload.year);

      window.location.href = '/student_introduction.html';
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students Database — Admin Portal</title>
  <link rel="stylesheet" href="/student.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div style="padding: 0 1.5rem; margin-bottom: 2rem;">
        <div style="width: 40px; height: 40px; border-radius: 0.5rem; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); display: flex; align-items: center; justify-content: center; font-size: 1.25rem; margin-bottom: 0.75rem;">🛡️</div>
        <h1 style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary); line-height: 1.2; padding: 0;">Admin Portal</h1>
        <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.2rem;">Interview Management</p>
      </div>

      <nav class="sidebar-nav" style="flex: 1;">
        <a href="/admin_live_interviews.html" class="nav-link" id="navLive">
          <span style="font-size: 1rem;">📡</span>
          Live Interviews
        </a>
        <a href="/admin_students.html" class="nav-link active" id="navStudents">
          <span style="font-size: 1rem;">👥</span>
          Students
        </a>
        <a href="/admin_ai_config.html" class="nav-link" id="navConfig">
          <span style="font-size: 1rem;">🤖</span>
          AI Configuration
        </a>
        <a href="/admin_audit_logs.html" class="nav-link" id="navLogs">
          <span style="font-size: 1rem;">📋</span>
          Audit Logs
        </a>
      </nav>

      <div style="padding: 1rem; border-top: 1px solid var(--glass-border); margin-top: auto;">
        <button onclick="handleLogout()" style="width: 100%; padding: 0.625rem 1rem; border-radius: 0.5rem; background: transparent; border: 1px solid rgba(239,68,68,0.4); color: #ef4444; cursor: pointer; font-weight: 500; font-size: 0.875rem; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s;" onmouseenter="this.style.background='rgba(239,68,68,0.08)'" onmouseleave="this.style.background='transparent'">
          🚪 Logout
        </button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="admin-main">
      <div class="glass-panel" style="padding: 2rem; flex: 1;">
        <!-- Header area -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <div>
            <h2 style="color: var(--text-primary); margin-bottom: 0.25rem;">Students Database</h2>
            <p style="color: var(--text-secondary); font-size: 0.875rem;" id="totalLabel">0 total candidates</p>
          </div>
          <button id="refreshBtn" class="btn-secondary" style="font-size: 0.875rem; padding: 0.5rem 1rem;">⟳ Refresh</button>
        </div>

        <!-- Filters row -->
        <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
          <input
            type="text"
            id="searchBar"
            placeholder="🔍 Search by name, USN, or college..."
            style="flex: 1; min-width: 200px; padding: 0.625rem 1rem; border-radius: 0.5rem; border: 1px solid var(--glass-border); background: rgba(15, 23, 42, 0.04); color: var(--text-primary); fontSize: 0.875rem; outline: none;"
          />
          <div style="display: flex; gap: 0.5rem;" id="filterButtons">
            <button class="btn-secondary filter-btn" data-filter="all" style="padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; background: var(--accent-primary); color: white;">All</button>
            <button class="btn-secondary filter-btn" data-filter="completed" style="padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.8rem; font-weight: 600; cursor: pointer;">✓ Completed</button>
            <button class="btn-secondary filter-btn" data-filter="in_progress" style="padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.8rem; font-weight: 600; cursor: pointer;">● Live</button>
          </div>
        </div>

        <!-- Data table -->
        <div id="loadingText" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
          Loading candidates...
        </div>

        <div id="emptyText" style="display: none; text-align: center; padding: 2rem; color: var(--text-secondary);">
          No candidates match your search.
        </div>

        <div id="tableWrapper" style="display: none; overflow-x: auto;">
          <table class="dashboard-table">
            <thead>
              <tr>
                <th>Student</th>
                <th>College / Branch</th>
                <th>Status</th>
                <th>Score</th>
                <th>Started</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Rows inserted dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    async function handleLogout() {
      await fetch('/api/admin/logout', { method: 'POST' });
      window.location.href = '/admin_login.html';
    }

    let sessions = [];
    let search = "";
    let filter = "all";

    const loadingText = document.getElementById('loadingText');
    const emptyText = document.getElementById('emptyText');
    const tableWrapper = document.getElementById('tableWrapper');
    const tableBody = document.getElementById('tableBody');
    const totalLabel = document.getElementById('totalLabel');
    const searchBar = document.getElementById('searchBar');
    const refreshBtn = document.getElementById('refreshBtn');

    async function fetchSessions() {
      try {
        const res = await fetch('/api/admin/sessions');
        if (res.status === 401) {
          window.location.href = '/admin_login.html';
          return;
        }

        const data = await res.json();
        sessions = data.sessions || [];
        renderList();
      } catch (err) {
        console.error("Failed to fetch sessions:", err);
      }
    }

    function getScoreColor(score) {
      if (score >= 80) return '#10b981';
      if (score >= 60) return '#f59e0b';
      return '#ef4444';
    }

    const statusColors = {
      completed: 'status-active',
      in_progress: 'status-waiting',
      waiting: 'status-paused',
      paused: 'status-paused',
    };

    function renderList() {
      loadingText.style.display = 'none';
      totalLabel.textContent = `${sessions.length} total candidate${sessions.length === 1 ? '' : 's'}`;

      const filtered = sessions.filter(s => {
        const matchSearch = search === '' ||
          s.studentName.toLowerCase().includes(search.toLowerCase()) ||
          s.usn.toLowerCase().includes(search.toLowerCase()) ||
          (s.college || '').toLowerCase().includes(search.toLowerCase());
        const matchFilter = filter === 'all' || s.status === filter;
        return matchSearch && matchFilter;
      });

      if (filtered.length === 0) {
        emptyText.style.display = 'block';
        tableWrapper.style.display = 'none';
      } else {
        emptyText.style.display = 'none';
        tableBody.innerHTML = "";

        filtered.forEach(s => {
          const tr = document.createElement('tr');
          const timeStr = new Date(s.startTime).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          const statusClass = statusColors[s.status] || 'status-waiting';

          const scoreCol = s.score !== undefined
            ? `<span style="font-weight: 700; font-size: 1.1rem; color: ${getScoreColor(s.score)}">${s.score}/100</span>`
            : `<span style="color: var(--text-secondary)">—</span>`;

          const reportBtn = s.score !== undefined
            ? `<a href="/student_report.html?sessionId=${encodeURIComponent(s.sessionId)}" target="_blank" class="btn-secondary" style="padding: 0.375rem 0.75rem; font-size: 0.8rem; text-decoration: none;">Report</a>`
            : ``;

          tr.innerHTML = `
            <td>
              <div style="font-weight: 600; color: 'var(--text-primary)'">${escapeHTML(s.studentName)}</div>
              <div style="font-size: 0.8rem; color: var(--text-secondary)">${escapeHTML(s.usn)}</div>
            </td>
            <td>
              <div style="font-size: 0.9rem">${escapeHTML(s.college || '—')}</div>
              <div style="font-size: 0.8rem; color: var(--text-secondary)">${escapeHTML(s.branch || '—')} • ${escapeHTML(s.year || '—')}</div>
            </td>
            <td>
              <span class="status-badge ${statusClass}">
                ${escapeHTML(s.status.replace('_', ' ').toUpperCase())}
              </span>
            </td>
            <td>${scoreCol}</td>
            <td style="color: var(--text-secondary); font-size: 0.875rem;">${timeStr}</td>
            <td style="display: flex; gap: 0.5rem; align-items: center; border: none;">
              <a href="/admin_monitor.html?sessionId=${encodeURIComponent(s.sessionId)}" class="btn-primary" style="padding: 0.375rem 0.75rem; font-size: 0.8rem; text-decoration: none;">Observe</a>
              ${reportBtn}
            </td>
          `;
          tableBody.appendChild(tr);
        });
        tableWrapper.style.display = 'block';
      }
    }

    function escapeHTML(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    searchBar.addEventListener('input', (e) => {
      search = e.target.value;
      renderList();
    });

    const filterBtns = document.querySelectorAll('.filter-btn');
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => {
          b.style.background = 'transparent';
          b.style.color = 'var(--text-secondary)';
          b.style.borderColor = 'var(--glass-border)';
        });
        btn.style.background = 'var(--accent-primary)';
        btn.style.color = 'white';
        btn.style.borderColor = 'var(--accent-primary)';

        filter = btn.getAttribute('data-filter');
        renderList();
      });
    });

    refreshBtn.addEventListener('click', fetchSessions);

    fetchSessions();
  </script>
</body>
</html>

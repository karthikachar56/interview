version: '3.8'
services:
  mongo:
    image: mongo:6.0
    container_name: ai_interview_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: ai_interview_app
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017

volumes:
  mongo_data:
